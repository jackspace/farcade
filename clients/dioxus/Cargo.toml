[package]
name = "farcade-dioxus"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike: a Dioxus front end over Farcade's existing LocalAPI"

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

# A spike stays a spike: no workspace membership, so it cannot slow the gate down
# or drag a Rust toolchain into the Python package's build.
[workspace]
